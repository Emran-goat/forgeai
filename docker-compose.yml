services:
  forgeai:
    build: .
    ports:
      - "8000:8000"
      - "3000:3000"
    env_file:
      - .env
    environment:
      - FIREWORKS_API_KEY=${FIREWORKS_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

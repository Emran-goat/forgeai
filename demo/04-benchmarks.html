<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForgeAI — Benchmarks</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  :root{
    --ink:#0f0f0f;
    --indigo:#1a1a2e;
    --stone:#e8e4e1;
    --white:#fafaf9;
    --vermilion:#c0392b;
    --ease:cubic-bezier(0.16,1,0.3,1);
    --bounce:cubic-bezier(0.34,1.56,0.64,1);
  }

  html{scroll-behavior:smooth}

  body{
    font-family:system-ui,-apple-system,sans-serif;
    background:var(--ink);
    color:var(--white);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    padding-bottom:48px;
  }

  /* ── Dot Grid Background ── */
  .dot-grid{
    position:fixed;inset:0;
    pointer-events:none;z-index:0;
  }
  .dot-grid::before{
    content:'';position:absolute;inset:-50%;
    background-image:radial-gradient(circle,var(--stone) 0.5px,transparent 0.5px);
    background-size:32px 32px;
    opacity:0.04;
  }
  .dot-grid::after{
    content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse 60% 50% at 50% 50%,transparent 0%,var(--ink) 70%);
  }

  /* ── Page Layout ── */
  .page{
    position:relative;z-index:1;
    max-width:900px;
    margin:0 auto;
    padding:5rem 2rem 4rem;
  }

  /* ── Title: FORGEAI ── */
  .page-title{
    font-weight:200;
    font-size:clamp(3rem,8vw,3.5rem);
    letter-spacing:-0.03em;
    color:var(--white);
    line-height:1;
    margin-bottom:0.75rem;
    opacity:0;
    transform:translateY(24px) scale(0.96);
  }
  .page-title.snap{
    animation:snap-in 0.3s var(--ease) forwards;
  }
  @keyframes snap-in{
    0%{opacity:0;transform:translateY(24px) scale(0.96)}
    100%{opacity:1;transform:translateY(0) scale(1)}
  }

  .page-sub{
    font-weight:300;
    font-size:0.9rem;
    color:var(--stone);
    opacity:0.5;
    letter-spacing:0.04em;
    margin-bottom:5rem;
    opacity:0;
    transform:translateY(12px);
  }
  .page-sub.snap{
    animation:snap-in 0.4s var(--ease) 0.15s forwards;
  }

  /* ── Section Heading ── */
  .section-head{
    margin-bottom:2.5rem;
    opacity:0;
    transform:translateY(20px);
  }
  .section-head.snap{
    animation:snap-in 0.4s var(--ease) forwards;
  }

  .section-title{
    font-weight:200;
    font-size:28px;
    letter-spacing:-0.01em;
    color:var(--white);
    display:flex;
    align-items:baseline;
    gap:0.5rem;
  }
  .section-title .unit{
    color:var(--vermilion);
    font-weight:400;
    font-size:16px;
    letter-spacing:0.04em;
  }

  /* ── Bar Chart ── */
  .bar-row{
    display:flex;
    align-items:center;
    gap:1.25rem;
    margin-bottom:1.25rem;
  }

  .bar-label{
    width:180px;
    flex-shrink:0;
    font-weight:400;
    font-size:15px;
    color:var(--stone);
    text-align:right;
    letter-spacing:0.02em;
  }

  .bar-track{
    flex:1;
    height:40px;
    background:rgba(232,228,225,0.05);
    border-radius:6px;
    position:relative;
    overflow:hidden;
  }

  .bar-fill{
    height:100%;
    border-radius:6px;
    width:0;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding-right:16px;
    transform-origin:left center;
    will-change:width,transform;
  }

  .bar-fill.stone{background:var(--stone);opacity:0.3}
  .bar-fill.indigo{background:var(--indigo)}
  .bar-fill.vermilion{background:var(--vermilion)}

  .bar-fill.slam{
    animation:bar-slam 0.4s var(--bounce) forwards;
  }

  @keyframes bar-slam{
    0%{width:0;transform:scaleX(0.3)}
    60%{transform:scaleX(1.04)}
    100%{width:var(--target-width);transform:scaleX(1)}
  }

  .bar-value{
    font-weight:300;
    font-size:18px;
    color:var(--white);
    letter-spacing:0.02em;
    white-space:nowrap;
    opacity:0;
    transition:opacity 0.25s ease;
  }
  .bar-fill.slam .bar-value{opacity:1}

  /* ── Scatter Plot ── */
  .scatter-wrap{
    position:relative;
    width:100%;
    margin-top:1rem;
  }
  .scatter-wrap svg{
    width:100%;
    height:auto;
    display:block;
  }

  .scatter-point{
    opacity:0;
    transform-origin:center;
  }
  .scatter-point.pop{
    animation:dot-pop 0.5s var(--bounce) forwards;
  }

  @keyframes dot-pop{
    0%{opacity:0;transform:scale(0)}
    100%{opacity:1;transform:scale(1)}
  }

  .scatter-label{
    font-family:system-ui,-apple-system,sans-serif;
    font-size:13px;
    fill:var(--stone);
    opacity:0;
    pointer-events:none;
  }
  .scatter-label.show{opacity:0.65}

  .pareto-line{
    stroke:var(--vermilion);
    stroke-width:2;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
    opacity:0.8;
  }

  .axis-line{
    stroke:var(--stone);
    stroke-width:0.5;
    opacity:0.15;
  }

  .axis-label{
    font-family:system-ui,-apple-system,sans-serif;
    font-size:13px;
    fill:var(--stone);
    opacity:0.4;
    letter-spacing:0.06em;
  }

  .tick-line{
    stroke:var(--stone);
    stroke-width:0.5;
    opacity:0.1;
  }

  /* ── Accent Lines ── */
  .accent-v{
    position:fixed;left:10%;top:12%;
    width:1px;height:0;
    background:linear-gradient(to bottom,transparent,var(--white) 20%,var(--white) 80%,transparent);
    opacity:0.05;z-index:0;pointer-events:none;
  }
  .accent-v.snap{animation:line-grow 2s var(--ease) 0.5s forwards}
  .accent-h{
    position:fixed;right:8%;bottom:25%;
    height:1px;width:0;
    background:linear-gradient(to right,transparent,var(--vermilion) 30%,var(--vermilion) 70%,transparent);
    opacity:0.1;z-index:0;pointer-events:none;
  }
  .accent-h.snap{animation:line-grow-h 2s var(--ease) 0.8s forwards}
  @keyframes line-grow{to{height:70%}}
  @keyframes line-grow-h{to{width:120px}}

  /* ── Section spacing ── */
  .benchmark-section{margin-bottom:6rem}

  /* ── Index Link ── */
  .demo-index-link{
    position:fixed;top:16px;right:24px;z-index:9999;
    font:11px/1 system-ui,sans-serif;
    letter-spacing:0.1em;text-transform:uppercase;
    color:var(--stone);text-decoration:none;
    transition:color 0.2s ease;
  }
  .demo-index-link:hover{color:var(--vermilion)}

  /* ── Navigation Bar ── */
  .demo-nav{
    position:fixed;bottom:0;left:0;right:0;
    height:48px;
    background:rgba(15,15,15,0.9);
    backdrop-filter:blur(12px);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;
    z-index:9999;
    font:11px/1 system-ui,sans-serif;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--stone);
  }
  .demo-nav a{color:inherit;text-decoration:none;transition:color 0.2s ease}
  .demo-nav a:hover{color:var(--vermilion)}
  .demo-nav .nav-prev{min-width:80px}
  .demo-nav .nav-center{text-align:center;flex:1}
  .demo-nav .nav-next{min-width:80px;text-align:right}
  .demo-nav .nav-dots{display:flex;gap:6px;align-items:center;min-width:80px;justify-content:flex-end}
  .demo-nav .nav-dot{width:6px;height:6px;border-radius:50%;background:rgba(232,228,225,0.3);display:inline-block}
  .demo-nav .nav-dot.active{background:var(--vermilion)}
  .demo-nav .nav-spacer{min-width:80px}

  @media(max-width:768px){
    .page{padding:3.5rem 1.25rem 4rem}
    .bar-label{width:120px;font-size:13px}
    .accent-v,.accent-h{display:none}
  }
</style>
</head>
<body>

<div class="dot-grid"></div>

<a href="index.html" class="demo-index-link">Index</a>

<div class="page">

  <!-- Title -->
  <h1 class="page-title" id="pageTitle">FORGEAI</h1>
  <p class="page-sub" id="pageSub">Measured on AMD MI300X · ROCm 6.0</p>

  <!-- ═══ Section 1: Latency ═══ -->
  <section class="benchmark-section">
    <div class="section-head" id="head-latency">
      <h2 class="section-title">Latency <span class="unit">/ms</span></h2>
    </div>

    <div class="bar-row">

    <div class="bar-row">
      <span class="bar-label">Pruned + INT8</span>

    <div class="bar-row">

    <div class="section-head" id="head-pareto">
      <h2 class="section-title">Pareto Frontier <span class="unit">Latency vs Accuracy</span></h2>
    </div>

    <div class="scatter-wrap">
      <svg viewBox="0 0 700 380" preserveAspectRatio="xMidYMid meet">
        <!-- Grid area: x 70-660, y 30-320 -->
        <line x1="70" y1="320" x2="660" y2="320" class="axis-line"/>
        <line x1="70" y1="30" x2="70" y2="320" class="axis-line"/>

        <!-- X ticks (latency 0-100ms) -->
        <line x1="70" y1="320" x2="70" y2="326" class="tick-line"/>
        <line x1="188" y1="320" x2="188" y2="326" class="tick-line"/>
        <line x1="306" y1="320" x2="306" y2="326" class="tick-line"/>
        <line x1="424" y1="320" x2="424" y2="326" class="tick-line"/>
        <line x1="542" y1="320" x2="542" y2="326" class="tick-line"/>
        <line x1="660" y1="320" x2="660" y2="326" class="tick-line"/>

        <!-- X axis labels -->
        <text x="70" y="348" class="axis-label" text-anchor="middle">0</text>
        <text x="188" y="348" class="axis-label" text-anchor="middle">20</text>
        <text x="306" y="348" class="axis-label" text-anchor="middle">40</text>
        <text x="424" y="348" class="axis-label" text-anchor="middle">60</text>
        <text x="542" y="348" class="axis-label" text-anchor="middle">80</text>
        <text x="660" y="348" class="axis-label" text-anchor="middle">100</text>

        <!-- Y ticks (accuracy 70-98%) -->
        <line x1="64" y1="320" x2="70" y2="320" class="tick-line"/>
        <line x1="64" y1="259.6" x2="70" y2="259.6" class="tick-line"/>
        <line x1="64" y1="199.3" x2="70" y2="199.3" class="tick-line"/>
        <line x1="64" y1="138.9" x2="70" y2="138.9" class="tick-line"/>
        <line x1="64" y1="78.6" x2="70" y2="78.6" class="tick-line"/>
        <line x1="64" y1="30" x2="70" y2="30" class="tick-line"/>

        <!-- Y axis labels -->
        <text x="54" y="324" class="axis-label" text-anchor="end">70%</text>
        <text x="54" y="263" class="axis-label" text-anchor="end">76%</text>
        <text x="54" y="203" class="axis-label" text-anchor="end">82%</text>
        <text x="54" y="142" class="axis-label" text-anchor="end">88%</text>
        <text x="54" y="82" class="axis-label" text-anchor="end">94%</text>
        <text x="54" y="34" class="axis-label" text-anchor="end">98%</text>

        <!-- Axis titles -->
        <text x="365" y="374" class="axis-label" text-anchor="middle" style="opacity:0.55;letter-spacing:0.1em">LATENCY (MS)</text>
        <text x="18" y="175" class="axis-label" text-anchor="middle" style="opacity:0.55;letter-spacing:0.1em;writing-mode:tb">ACCURACY (%)</text>

        <!-- Data points: x = 70 + (latency/100)*590, y = 320 - ((acc-70)/28)*290 -->
        <!-- Non-optimal (indigo): -->
        <!-- A: 58ms, 89% → x=408.2, y=128.6 -->
        <!-- B: 45ms, 91% → x=331.5, y=109.6 -->

        <!-- Optimal (vermilion): -->
        <!-- C: 62ms, 96.5% → x=431.8, y=62.9 -->
        <!-- D: 28ms, 95.2% → x=235.2, y=75.0 -->
        <!-- E: 18ms, 94.8% → x=176.2, y=78.8 -->
        <!-- F: 12ms, 93.5% → x=140.8, y=91.1 -->

        <!-- Pareto frontier line -->
        <polyline
          points="140.8,91.1 176.2,78.8 235.2,75.0 431.8,62.9"
          class="pareto-line"
          id="pareto-line"
          stroke-dasharray="600"
          stroke-dashoffset="600"
        />

        <!-- Non-optimal points -->
        <circle cx="408.2" cy="128.6" r="0" class="scatter-point" id="pt-a" fill="#1a1a2e" stroke="#fafaf9" stroke-width="1.5"/>
        <text x="416" y="120" class="scatter-label" id="lbl-a">58ms · 89%</text>

        <circle cx="331.5" cy="109.6" r="0" class="scatter-point" id="pt-b" fill="#1a1a2e" stroke="#fafaf9" stroke-width="1.5"/>
        <text x="339" y="101" class="scatter-label" id="lbl-b">45ms · 91%</text>

        <circle cx="431.8" cy="62.9" r="0" class="scatter-point" id="pt-c" fill="#c0392b" stroke="#fafaf9" stroke-width="1.5"/>

        <circle cx="176.2" cy="78.8" r="0" class="scatter-point" id="pt-e" fill="#c0392b" stroke="#fafaf9" stroke-width="1.5"/>
        <text x="184" y="70" class="scatter-label" id="lbl-e">18ms · 94.8%</text>

        <circle cx="140.8" cy="91.1" r="0" class="scatter-point" id="pt-f" fill="#c0392b" stroke="#fafaf9" stroke-width="1.5"/>
        <text x="112" y="104" class="scatter-label" id="lbl-f">12ms · 93.5%</text>

      </svg>
    </div>
  </section>

</div>

<script>
(function(){
  var easeOutCubic=function(t){return 1-Math.pow(1-t,3)};
  var DURATION=1200;

  function animateValue(el,target,suffix,startDelay){
    var startTime=null;
    function tick(now){
      if(!startTime)startTime=now;
      var elapsed=now-startTime;
      var t=Math.min(elapsed/DURATION,1);
      var v=Math.round(easeOutCubic(t)*target);
      el.textContent=v+suffix;
      if(t<1)requestAnimationFrame(tick);
    }
    setTimeout(function(){requestAnimationFrame(tick)},startDelay);
  }

  function slamBars(section,delay){
    var fills=section.querySelectorAll('.bar-fill');
    fills.forEach(function(f,i){
      setTimeout(function(){
        f.classList.add('slam');
        var v=f.querySelector('.bar-value');
        if(v){
          var target=parseInt(v.dataset.target);
          var suffix=v.dataset.suffix||'';
          animateValue(v,target,suffix,200);
        }
      },delay+i*300);
    });
  }

  function popDots(section,delay){
    var points=section.querySelectorAll('.scatter-point');
    var labels=section.querySelectorAll('.scatter-label');
    var line=document.getElementById('pareto-line');

    points.forEach(function(p,i){
      setTimeout(function(){
        p.setAttribute('r','8');
        p.classList.add('pop');
      },delay+i*50);
    });

    labels.forEach(function(l,i){
      setTimeout(function(){
        l.classList.add('show');
      },delay+i*50+150);
    });

    if(line){
      setTimeout(function(){
        line.style.transition='stroke-dashoffset 0.6s cubic-bezier(0.16,1,0.3,1)';
        line.style.strokeDashoffset='0';
      },delay+points.length*50+100);
    }
  }

  function triggerAll(){
    var title=document.getElementById('pageTitle');
    var sub=document.getElementById('pageSub');
    var headLatency=document.getElementById('head-latency');
    var headMemory=document.getElementById('head-memory');
    var headPareto=document.getElementById('head-pareto');
    var latencySection=document.querySelector('.benchmark-section:nth-of-type(1)');
    var memorySection=document.querySelector('.benchmark-section:nth-of-type(2)');
    var paretoSection=document.querySelector('.benchmark-section:nth-of-type(3)');

    // 0.0s: Title SNAPS in
    title.classList.add('snap');
    // accent lines
    document.querySelector('.accent-v').classList.add('snap');
    document.querySelector('.accent-h').classList.add('snap');

    // 0.15s: Subtitle
    setTimeout(function(){sub.classList.add('snap')},150);

    // 0.3s: Latency heading
    setTimeout(function(){headLatency.classList.add('snap')},300);

    // 0.5s: Bar 1 slams
    // 0.8s: Bar 2 slams
    // 1.1s: Bar 3 slams
    setTimeout(function(){slamBars(latencySection,500)},0);

    // 1.5s: Memory heading
    setTimeout(function(){headMemory.classList.add('snap')},1500);

    // 1.7s: Memory bars
    setTimeout(function(){slamBars(memorySection,1700)},0);

    // 2.5s: Pareto heading
    setTimeout(function(){headPareto.classList.add('snap')},2500);

    // 2.8s: Dots pop in
    // 3.2s: Frontier line draws
    setTimeout(function(){popDots(paretoSection,2800)},0);
  }

  // Start immediately
  triggerAll();
})();
</script>

</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForgeAI — Export Model</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  :root{
    --ink:#0f0f0f;
    --indigo:#1a1a2e;
    --stone:#e8e4e1;
    --white:#fafaf9;
    --vermilion:#c0392b;
    --ease:cubic-bezier(0.16,1,0.3,1);
    --bounce:cubic-bezier(0.34,1.56,0.64,1);
  }

  html{scroll-behavior:smooth}

  body{
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--ink);
    color:var(--white);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  /* ── Dot Grid ── */
  .dot-grid{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
  }

  .dot-grid::before{
    content:'';
    position:absolute;
    inset:-50%;
    background-image:
      radial-gradient(circle,rgba(232,228,225,0.06) 1px,transparent 1px);
    background-size:32px 32px;
  }

  .dot-grid::after{
    content:'';
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse 60% 50% at 50% 50%,transparent 0%,var(--ink) 70%);
  }

  /* ── Scene Container ── */
  .scene-wrap{
    position:relative;
    width:100%;
    max-width:680px;
    padding:4rem 2rem;
    z-index:1;
    overflow:hidden;
    height:calc(100vh - 48px);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ── Scene (stage) ── */
  .scene{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:4rem 2rem;
    opacity:0;
    pointer-events:none;
  }

  .scene.active{
    opacity:1;
    pointer-events:auto;
  }

  /* ── Title Block ── */
  .title-block{
    text-align:center;
    margin-bottom:3rem;
    opacity:0;
    transform:translateY(16px) scale(0.97);
    animation:title-snap 0.4s var(--ease) 0s forwards;
  }

  @keyframes title-snap{
    to{opacity:1;transform:translateY(0) scale(1)}
  }

  .title-block h1{
    font-family:'Georgia','Times New Roman',serif;
    font-weight:200;
    font-size:48px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--white);
  }

  .title-sep{
    width:32px;
    height:2px;
    background:var(--vermilion);
    margin:1.25rem auto 0;
    transform:scaleX(0);
    animation:sep-snap 0.3s var(--ease) 0.15s forwards;
  }

  @keyframes sep-snap{
    to{transform:scaleX(1)}
  }

  /* ── Format Cards ── */
  .formats{
    display:flex;
    gap:1.5rem;
    width:100%;
    max-width:620px;
  }

  .card{
    flex:1;
    background:rgba(26,26,46,0.6);
    border:2px solid rgba(232,228,225,0.15);
    border-radius:2px;
    padding:32px 24px;
    text-align:center;
    cursor:pointer;
    position:relative;
    opacity:0;
    transform:translateY(40px);
    transition:border-color 0.3s var(--ease), box-shadow 0.3s var(--ease);
  }

  .card.slide-up{
    animation:card-overshoot 0.5s var(--bounce) forwards;
  }

  .card:nth-child(1).slide-up{animation-delay:0.2s}
  .card:nth-child(2).slide-up{animation-delay:0.4s}
  .card:nth-child(3).slide-up{animation-delay:0.6s}

  @keyframes card-overshoot{
    0%{opacity:0;transform:translateY(40px)}
    100%{opacity:1;transform:translateY(0)}
  }

  .card.selected{
    border-color:var(--vermilion);
    box-shadow:0 0 0 1px var(--vermilion);
  }

  /* ── Card Icons (48×48 CSS) ── */
  .card-icon{
    width:48px;
    height:48px;
    margin:0 auto 1.25rem;
    position:relative;
  }

  /* Cube — ONNX */
  .icon-cube{
    position:absolute;
    left:50%;top:50%;
    width:26px;height:26px;
    transform:translate(-50%,-50%) rotate(45deg);
    border:2.5px solid var(--stone);
  }

  .icon-cube::before{
    content:'';
    position:absolute;
    left:5px;top:5px;
    width:12px;height:12px;
    border:2px solid var(--stone);
    border-left:none;border-bottom:none;
    opacity:0.5;
  }

  /* Flame — TorchScript */
  .icon-flame{
    position:absolute;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    width:20px;height:32px;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    border:2.5px solid var(--stone);
  }

  .icon-flame::before{
    content:'';
    position:absolute;
    left:50%;bottom:2px;
    width:8px;height:14px;
    transform:translateX(-50%);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    border:2px solid var(--stone);
    opacity:0.5;
  }

  /* Layers — GGUF */
  .icon-layers{
    position:absolute;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    width:30px;height:24px;
  }

  .icon-layers::before{
    content:'';
    position:absolute;
    left:0;top:0;
    width:30px;height:14px;
    border:2.5px solid var(--stone);
    border-radius:50%;
  }

  .icon-layers::after{
    content:'';
    position:absolute;
    left:4px;top:10px;
    width:22px;height:12px;
    border:2.5px solid var(--stone);
    border-radius:50%;
    opacity:0.6;
  }

  .card .label{
    font-size:18px;
    font-weight:500;
    color:var(--stone);
    margin-bottom:0.3rem;
  }

  .card .meta{
    font-size:14px;
    color:rgba(232,228,225,0.4);
    letter-spacing:0.03em;
  }

  .card .rec{
    display:inline-block;
    margin-top:0.75rem;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--vermilion);
    font-weight:600;
    opacity:0;
    transition:opacity 0.3s var(--ease);
  }

  .card.selected .rec{opacity:1}

  /* ── Arrow Button ── */
  .arrow-row{
    margin-top:2.5rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1rem;
  }

  .arrow-btn{
    width:56px;
    height:56px;
    border:none;
    background:var(--ink);
    color:var(--white);
    border-radius:50%;
    font-size:20px;
    cursor:pointer;
    opacity:0;
    transform:scale(0.7);
    transition:opacity 0.35s var(--ease), transform 0.35s var(--ease), background 0.2s ease;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .arrow-btn.show{
    opacity:1;
    transform:scale(1);
  }

  .arrow-btn:hover{
    background:var(--indigo);
    transform:scale(1.08);
  }

  /* ── Scene Transitions ── */
  .scene.slide-left{
    animation:slide-out-left 0.35s var(--ease) forwards;
  }

  .scene.slide-in-right{
    animation:slide-in-right 0.35s var(--ease) forwards;
  }

  .scene.slide-left-fast{
    animation:slide-out-left 0.25s var(--ease) forwards;
  }

  .scene.slide-in-right-fast{
    animation:slide-in-right 0.25s var(--ease) forwards;
  }

  @keyframes slide-out-left{
    0%{opacity:1;transform:translateX(0)}
    100%{opacity:0;transform:translateX(-40px)}
  }

  @keyframes slide-in-right{
    0%{opacity:0;transform:translateX(40px)}
    100%{opacity:1;transform:translateX(0)}
  }

  /* ── Progress Ring ── */
  .ring-wrap{
    position:relative;
    width:200px;
    height:200px;
    margin-bottom:2.5rem;
    opacity:0;
    transform:scale(0.85);
    animation:ring-pop 0.5s var(--bounce) 0.05s forwards;
  }

  @keyframes ring-pop{
    to{opacity:1;transform:scale(1)}
  }

  .ring-wrap svg{
    width:100%;
    height:100%;
    transform:rotate(-90deg);
  }

  .ring-bg{
    fill:none;
    stroke:rgba(232,228,225,0.15);
    stroke-width:2;
  }

  .ring-fg{
    fill:none;
    stroke:var(--vermilion);
    stroke-width:2;
    stroke-linecap:round;
    stroke-dasharray:502.65;
    stroke-dashoffset:502.65;
  }

  .pct{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:48px;
    font-weight:200;
    color:var(--white);
    letter-spacing:0.02em;
  }

  .pct::after{
    content:'%';
    font-size:20px;
    opacity:0.4;
    margin-left:2px;
  }

  .status-label{
    font-size:14px;
    color:rgba(232,228,225,0.4);
    letter-spacing:0.06em;
    position:relative;
    height:1.4em;
    text-align:center;
    overflow:hidden;
  }

  .status-label span{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    white-space:nowrap;
    opacity:0;
    transition:opacity 0.4s var(--ease);
  }

  .status-label span.on{opacity:1}

  /* ── Stage 3: Download Ready ── */
  .dl-icon-wrap{
    width:80px;
    height:80px;
    margin-bottom:2rem;
    position:relative;
    opacity:0;
    transform:scale(0);
    animation:dl-bounce 0.6s var(--bounce) 0.2s forwards;
  }

  @keyframes dl-bounce{
    0%{opacity:0;transform:scale(0)}
    60%{opacity:1;transform:scale(1.15)}
    100%{opacity:1;transform:scale(1)}
  }

  /* Download icon — 80×80 CSS */
  .dl-icon .shaft{
    position:absolute;
    left:50%;top:12px;
    width:2.5px;height:36px;
    background:var(--white);
    transform:translateX(-50%);
  }

  .dl-icon .shaft::before{
    content:'';
    position:absolute;
    left:-7px;top:-3px;
    width:14px;height:14px;
    border-right:2.5px solid var(--white);
    border-top:2.5px solid var(--white);
    transform:rotate(-45deg);
  }

  .dl-icon .tray{
    position:absolute;
    bottom:10px;left:50%;
    transform:translateX(-50%);
  }

  .dl-icon .tray::before{
    content:'';
    display:block;
    width:32px;height:2.5px;
    background:var(--white);
  }

  .dl-icon .tray::after{
    content:'';
    display:block;
    width:24px;height:12px;
    margin:0 auto;
    border:2.5px solid var(--white);
    border-top:none;
  }

  .file-info{
    text-align:center;
    margin-bottom:0.25rem;
    opacity:0;
    transform:translateY(12px);
    animation:fade-up 0.5s var(--ease) 0s forwards;
  }

  .file-name{
    font-size:24px;
    font-weight:300;
    color:var(--white);
    margin-bottom:0.3rem;
  }

  .file-size{
    font-size:14px;
    color:rgba(232,228,225,0.4);
    letter-spacing:0.04em;
  }

  .dl-btn{
    margin-top:2rem;
    display:inline-flex;
    align-items:center;
    gap:0.5rem;
    padding:18px 48px;
    background:var(--vermilion);
    color:var(--white);
    border:none;
    font-family:inherit;
    font-size:18px;
    font-weight:500;
    letter-spacing:2px;
    text-transform:uppercase;
    cursor:pointer;
    border-radius:2px;
    opacity:0;
    transform:translateY(14px);
    animation:btn-appear 0.45s var(--ease) 0s forwards;
    position:relative;
  }

  .dl-btn.show{
    animation:btn-appear 0.45s var(--ease) forwards;
  }

  @keyframes btn-appear{
    0%{opacity:0;transform:translateY(14px)}
    100%{opacity:1;transform:translateY(0)}
  }

  .dl-btn::after{
    content:'';
    position:absolute;
    inset:-6px;
    border-radius:4px;
    background:var(--vermilion);
    opacity:0;
    z-index:-1;
    animation:glow-pulse 2s 0.6s infinite;
  }

  @keyframes glow-pulse{
    0%,100%{opacity:0;transform:scale(1)}
    50%{opacity:0.2;transform:scale(1.06)}
  }

  .dl-btn:hover{background:#a93226}

  /* ── Checkmark ── */
  .check-row{
    margin-top:2.5rem;
    display:flex;
    align-items:center;
    gap:0.6rem;
    font-size:14px;
    color:rgba(232,228,225,0.4);
    letter-spacing:0.06em;
    opacity:0;
    animation:fade-up 0.5s var(--ease) 0s forwards;
  }

  .check-row.show{
    animation:fade-up 0.5s var(--ease) forwards;
  }

  .check-circle{
    width:20px;
    height:20px;
    border-radius:50%;
    border:1.5px solid var(--vermilion);
    position:relative;
    flex-shrink:0;
  }

  .check-circle::after{
    content:'';
    position:absolute;
    left:5px;top:2px;
    width:6px;height:9px;
    border-right:1.5px solid var(--vermilion);
    border-bottom:1.5px solid var(--vermilion);
    transform:rotate(45deg);
  }

  /* ── Utility ── */
  @keyframes fade-up{
    to{opacity:1;transform:translateY(0)}
  }

  /* ── Demo Navigation Bar ── */
  .demo-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:48px;
    background:rgba(15,15,15,0.9);
    backdrop-filter:blur(12px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    z-index:9999;
    font:11px/1 system-ui,sans-serif;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--stone);
  }

  .demo-nav a{color:inherit;text-decoration:none;transition:color 0.2s ease}
  .demo-nav a:hover{color:var(--vermilion)}
  .demo-nav .nav-prev{min-width:80px}
  .demo-nav .nav-center{text-align:center;flex:1}
  .demo-nav .nav-next{min-width:80px;text-align:right}
  .demo-nav .nav-dots{display:flex;gap:6px;align-items:center;min-width:80px;justify-content:flex-end}
  .demo-nav .nav-dot{width:6px;height:6px;border-radius:50%;background:rgba(232,228,225,0.3);display:inline-block}
  .demo-nav .nav-dot.active{background:var(--vermilion)}
  .demo-nav .nav-spacer{min-width:80px}

  .demo-index-link{
    position:fixed;
    top:16px;
    right:24px;
    z-index:9999;
    font:11px/1 system-ui,sans-serif;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--stone);
    text-decoration:none;
    transition:color 0.2s ease;
  }

  .demo-index-link:hover{color:var(--vermilion)}
</style>
</head>
<body>

<div class="dot-grid"></div>

<div class="scene-wrap">

  <!-- ═══ SCENE 1: FORMAT SELECTION ═══ -->
  <div class="scene active" id="s1">
    <div class="title-block">
      <h1>Export</h1>
      <div class="title-sep"></div>
    </div>

    <div class="formats" id="formats">
      <div class="card" data-fmt="onnx" onclick="selectCard(this)">
        <div class="card-icon"><div class="icon-cube"></div></div>
        <div class="label">ONNX</div>
        <div class="meta">156 MB</div>
        <div class="rec">Recommended</div>
      </div>
      <div class="card" data-fmt="torch" onclick="selectCard(this)">
        <div class="card-icon"><div class="icon-flame"></div></div>
        <div class="label">TorchScript</div>
        <div class="meta">172 MB</div>
        <div class="rec">Recommended</div>
      </div>
      <div class="card" data-fmt="gguf" onclick="selectCard(this)">
        <div class="card-icon"><div class="icon-layers"></div></div>
        <div class="label">GGUF</div>
        <div class="meta">148 MB</div>
        <div class="rec">Recommended</div>
      </div>
    </div>

    <div class="arrow-row">
      <button class="arrow-btn" id="nextBtn" onclick="goStage2()">&#8594;</button>
    </div>
  </div>

  <!-- ═══ SCENE 2: EXPORT PROGRESS ═══ -->
  <div class="scene" id="s2">
    <div class="ring-wrap">
      <svg viewBox="0 0 200 200">
        <circle class="ring-bg" cx="100" cy="100" r="80"/>
        <circle class="ring-fg" cx="100" cy="100" r="80" id="ring"/>
      </svg>
      <div class="pct" id="pct">0</div>
    </div>
    <div class="status-label" id="statusLabel">
      <span id="lbl1" class="on">Optimizing graph&#8230;</span>
      <span id="lbl2">Quantizing weights&#8230;</span>
      <span id="lbl3">Packaging model&#8230;</span>
    </div>
  </div>

  <!-- ═══ SCENE 3: DOWNLOAD READY ═══ -->
  <div class="scene" id="s3">
    <div class="dl-icon-wrap">
      <div class="dl-icon">
        <div class="shaft"></div>
        <div class="tray"></div>
      </div>
    </div>
    <div class="file-info" id="fileInfo">
      <div class="file-name">DINOv2-Base INT8</div>
      <div class="file-size">156 MB &middot; ONNX</div>
    </div>
    <button class="dl-btn" id="dlBtn"><span>&#8595;</span> Download</button>
    <div class="check-row" id="checkRow">
      <div class="check-circle"></div>
      Export complete
    </div>
  </div>

</div>

<a href="index.html" class="demo-index-link">Index</a>

<nav class="demo-nav">
  <div class="nav-prev"><a href="06-results.html">&larr; Prev</a></div>
  <div class="nav-center">07/07 &middot; Export</div>
  <span class="nav-spacer"></span>
  <div class="nav-dots">
    <span class="nav-dot"></span>
    <span class="nav-dot"></span>
    <span class="nav-dot"></span>
    <span class="nav-dot"></span>
    <span class="nav-dot"></span>
    <span class="nav-dot"></span>
    <span class="nav-dot active"></span>
  </div>
</nav>

<script>
(function(){
  var progressDuration = 4500;
  var circumference = 2 * Math.PI * 80;
  var labels = ['lbl1','lbl2','lbl3'];

  function setActive(el){
    labels.forEach(function(id){
      document.getElementById(id).classList.remove('on');
    });
    el.classList.add('on');
  }

  window.addEventListener('DOMContentLoaded', function(){
    var cards = document.querySelectorAll('#s1 .card');
    var nextBtn = document.getElementById('nextBtn');
    var ring = document.getElementById('ring');
    var pctEl = document.getElementById('pct');

    ring.style.strokeDasharray = circumference;
    ring.style.strokeDashoffset = circumference;

    /* 0.2s: cards slide up (200ms stagger) */
    setTimeout(function(){
      cards.forEach(function(c,i){
        setTimeout(function(){ c.classList.add('slide-up'); }, i * 200);
      });
    }, 200);

    /* 0.8s: ONNX auto-selects */
    setTimeout(function(){
      cards[0].click();
    }, 800);

    /* 1.0s: arrow button appears */
    setTimeout(function(){
      nextBtn.classList.add('show');
    }, 1000);
  });

  window.selectCard = function(el){
    document.querySelectorAll('#s1 .card').forEach(function(c){
      c.classList.remove('selected');
    });
    el.classList.add('selected');
  };

  window.goStage2 = function(){
    var s1 = document.getElementById('s1');
    var s2 = document.getElementById('s2');
    s1.classList.add('slide-left');
    setTimeout(function(){
      s1.classList.remove('active','slide-left');
      s2.classList.add('active','slide-in-right');
      setTimeout(function(){
        s2.classList.remove('slide-in-right');
      }, 350);
      startProgress();
    }, 350);
  };

  function startProgress(){
    var ring = document.getElementById('ring');
    var pctEl = document.getElementById('pct');
    var start = performance.now();

    function tick(now){
      var elapsed = now - start;
      var t = Math.min(elapsed / progressDuration, 1);
      var ease = 1 - Math.pow(1 - t, 3);
      var val = Math.round(ease * 100);

      pctEl.textContent = val;
      ring.style.strokeDashoffset = circumference - (circumference * ease);

      if(t < 0.33) setActive(document.getElementById('lbl1'));
      else if(t < 0.66) setActive(document.getElementById('lbl2'));
      else setActive(document.getElementById('lbl3'));

      if(t < 1) requestAnimationFrame(tick);
      else setTimeout(goStage3, 200);
    }

    requestAnimationFrame(tick);
  }

  function goStage3(){
    var s2 = document.getElementById('s2');
    var s3 = document.getElementById('s3');
    s2.classList.add('slide-left-fast');
    setTimeout(function(){
      s2.classList.remove('active','slide-left-fast');
      s3.classList.add('active','slide-in-right-fast');
      setTimeout(function(){
        s3.classList.remove('slide-in-right-fast');
      }, 250);

      /* 6.7s: file info fades up */
      setTimeout(function(){
        document.getElementById('fileInfo').style.animation = 'fade-up 0.5s var(--ease) forwards';
      }, 200);

      /* 7.0s: button appears */
      setTimeout(function(){
        document.getElementById('dlBtn').style.animation = 'btn-appear 0.45s var(--ease) forwards';
      }, 500);

      /* 7.3s: checkmark fades in */
      setTimeout(function(){
        document.getElementById('checkRow').style.animation = 'fade-up 0.5s var(--ease) forwards';
      }, 800);
    }, 250);
  }
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForgeAI — Upload Flow</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  :root{
    --ink:#0f0f0f;
    --indigo:#1a1a2e;
    --stone:#e8e4e1;
    --white:#fafaf9;
    --vermilion:#c0392b;
    --ease:cubic-bezier(0.16,1,0.3,1);
  }

  html{scroll-behavior:smooth}

  body{
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--ink);
    color:var(--white);
    overflow:hidden;
    height:100dvh;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  /* ── Dot Grid Background ── */
  .dot-grid{
    position:fixed;inset:0;pointer-events:none;z-index:0;
  }
  .dot-grid::before{
    content:'';position:absolute;inset:-50%;
    background-image:radial-gradient(circle,rgba(250,250,249,0.5) 0.6px,transparent 0.6px);
    background-size:32px 32px;
    opacity:0.04;
    animation:dot-breathe 4s var(--ease) infinite alternate;
  }
  @keyframes dot-breathe{
    0%{opacity:0.03;transform:scale(1)}
    100%{opacity:0.06;transform:scale(1.02)}
  }

  /* ── Scene Container ── */
  .scene-wrap{
    position:fixed;inset:0;z-index:1;
    display:flex;align-items:center;justify-content:center;
  }

  .scene{
    position:absolute;
    inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:2rem 2rem 5rem;
    transform:translateX(100%);
    transition:transform 0.3s var(--ease);
    will-change:transform;
  }
  .scene.active{transform:translateX(0)}
  .scene.exit{transform:translateX(-100%);transition:transform 0.3s var(--ease)}

  /* ── Step Dots ── */
  .step-dots{
    position:absolute;top:2.5rem;left:50%;transform:translateX(-50%);
    display:flex;gap:12px;z-index:2;
  }
  .step-dot{
    width:12px;height:12px;border-radius:50%;
    background:rgba(232,228,225,0.15);
    transition:background 0.3s var(--ease),transform 0.3s var(--ease);
  }
  .step-dot.active{
    background:var(--vermilion);
    transform:scale(1.15);
    box-shadow:0 0 0 3px rgba(192,57,43,0.25);
  }
  .step-dot.done{
    background:var(--vermilion);
  }

  /* ── Step Label ── */
  .step-label{
    font-size:14px;font-weight:500;text-transform:uppercase;
    letter-spacing:4px;color:rgba(232,228,225,0.5);
    margin-bottom:2.5rem;
    opacity:0;
    animation:label-in 0.4s var(--ease) 0.15s forwards;
  }
  @keyframes label-in{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:translateY(0)}
  }

  /* ── SCENE 1: Select Model ── */

  .file-icon{
    width:80px;height:96px;position:relative;
    margin-bottom:2.5rem;
    opacity:0;animation:icon-in 0.5s var(--ease) 0.3s forwards;
  }
  .file-icon .doc-body{
    width:80px;height:96px;
    border:2px dashed rgba(232,228,225,0.3);
    border-radius:6px;
    position:relative;
    animation:dashed-pulse 3s ease-in-out infinite;
  }
  .file-icon .doc-fold{
    position:absolute;top:0;right:0;
    width:24px;height:24px;
    background:linear-gradient(225deg,var(--ink) 50%,rgba(232,228,225,0.15) 50%);
    border-left:2px dashed rgba(232,228,225,0.3);
    border-bottom:2px dashed rgba(232,228,225,0.3);
  }
  .file-icon .doc-line{
    position:absolute;left:14px;
    height:2px;border-radius:1px;
    background:rgba(232,228,225,0.2);
  }
  .file-icon .doc-line:nth-child(3){width:36px;top:38px;animation:line-in 0.3s var(--ease) 0.6s forwards;opacity:0}
  .file-icon .doc-line:nth-child(4){width:28px;top:48px;animation:line-in 0.3s var(--ease) 0.7s forwards;opacity:0}
  .file-icon .doc-line:nth-child(5){width:40px;top:58px;animation:line-in 0.3s var(--ease) 0.8s forwards;opacity:0}
  .file-icon .doc-line:nth-child(6){width:20px;top:68px;animation:line-in 0.3s var(--ease) 0.9s forwards;opacity:0}
  @keyframes line-in{from{opacity:0}to{opacity:1}}

  @keyframes dashed-pulse{
    0%,100%{border-color:rgba(232,228,225,0.25)}
    50%{border-color:rgba(232,228,225,0.5)}
  }

  @keyframes icon-in{
    from{opacity:0;transform:scale(0.85)}
    to{opacity:1;transform:scale(1)}
  }

  /* ── Framework Badges ── */
  .badges{
    display:flex;gap:16px;
    opacity:0;animation:badges-in 0.4s var(--ease) 0.5s forwards;
  }
  @keyframes badges-in{from{opacity:0}to{opacity:1}}

  .badge{
    padding:14px 28px;
    border:1px solid rgba(232,228,225,0.15);
    border-radius:8px;
    font-size:16px;font-weight:400;
    letter-spacing:0.02em;
    color:rgba(232,228,225,0.6);
    cursor:pointer;
    transition:all 0.3s var(--ease);
    position:relative;
    transform:translateY(40px);
    opacity:0;
  }
  .badge:nth-child(1){animation:badge-slide 0.5s var(--ease) 0.6s forwards}
  .badge:nth-child(2){animation:badge-slide 0.5s var(--ease) 0.75s forwards}
  .badge:nth-child(3){animation:badge-slide 0.5s var(--ease) 0.9s forwards}

  @keyframes badge-slide{
    0%{opacity:0;transform:translateY(40px)}
    65%{transform:translateY(-4px)}
    80%{transform:translateY(2px)}
    100%{opacity:1;transform:translateY(0)}
  }

  .badge:hover{
    border-color:rgba(232,228,225,0.3);
    color:var(--white);
  }

  .badge.selected{
    border-color:var(--vermilion);
    color:var(--white);
    background:rgba(192,57,43,0.08);
  }

  .badge-check{
    position:absolute;top:8px;right:8px;
    width:18px;height:18px;
    opacity:0;transform:scale(0);
    transition:all 0.3s var(--ease);
  }
  .badge.selected .badge-check{
    opacity:1;transform:scale(1);
    transition-delay:0.15s;
  }
  .badge-check svg{
    width:18px;height:18px;
    stroke:var(--vermilion);stroke-width:2.5;fill:none;
    stroke-dasharray:24;stroke-dashoffset:24;
  }
  .badge.selected .badge-check svg{
    animation:check-draw 0.4s var(--ease) 0.1s forwards;
  }
  @keyframes check-draw{to{stroke-dashoffset:0}}

  /* ── SCENE 2: Upload & Detect ── */

  .upload-arrow{
    width:48px;height:48px;margin-bottom:2.5rem;
    opacity:0;
    animation:arrow-float 0.6s var(--ease) 0.3s forwards;
  }
  .upload-arrow svg{
    width:48px;height:48px;
    stroke:var(--stone);stroke-width:1.5;fill:none;
    stroke-linecap:round;stroke-linejoin:round;
  }
  @keyframes arrow-float{
    from{opacity:0;transform:translateY(12px)}
    to{opacity:1;transform:translateY(0)}
  }
  .upload-arrow svg{
    animation:arrow-bob 2.5s ease-in-out 0.6s infinite;
  }
  @keyframes arrow-bob{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-6px)}
  }

  .progress-wrap{
    width:320px;max-width:80vw;
    margin-bottom:2rem;
    opacity:0;animation:label-in 0.4s var(--ease) 0.4s forwards;
  }
  .progress-bar{
    width:100%;height:4px;
    background:rgba(232,228,225,0.1);
    border-radius:4px;overflow:hidden;
    position:relative;
  }
  .progress-fill{
    height:100%;width:0;
    background:linear-gradient(90deg,var(--vermilion),#e74c3c,var(--vermilion));
    border-radius:4px;
    animation:progress-grow 3s var(--ease) 0.6s forwards;
    position:relative;
  }
  .progress-fill::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);
    animation:shimmer 1.5s ease-in-out infinite;
  }
  @keyframes progress-grow{from{width:0}to{width:100%}}
  @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}

  .detection{
    text-align:center;
    opacity:0;animation:label-in 0.4s var(--ease) 1s forwards;
  }
  .detection-name{
    font-size:20px;font-weight:500;
    color:var(--vermilion);
    margin-bottom:0.5rem;
  }
  .detection-stats{
    font-size:14px;
    color:rgba(232,228,225,0.45);
    letter-spacing:0.02em;
  }

  /* ── SCENE 3: Ready ── */

  .check-circle-wrap{
    width:120px;height:120px;
    margin-bottom:2.5rem;
  }
  .check-circle-svg{
    width:120px;height:120px;
  }
  .check-circle-svg circle{
    fill:none;
    stroke:var(--vermilion);
    stroke-width:2;
    stroke-dasharray:360;
    stroke-dashoffset:360;
    animation:circle-draw 0.6s var(--ease) 0.3s forwards;
  }
  .check-circle-svg polyline{
    fill:none;
    stroke:var(--vermilion);
    stroke-width:2.5;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:40;
    stroke-dashoffset:40;
    opacity:0;
  }
  .check-circle-svg polyline.draw{
    animation:check-draw 0.4s var(--ease) 0.9s forwards;
  }

  @keyframes circle-draw{to{stroke-dashoffset:0}}

  .ready-title{
    font-size:32px;font-weight:200;
    letter-spacing:-0.01em;
    margin-bottom:2.5rem;
    opacity:0;animation:label-in 0.5s var(--ease) 1.1s forwards;
  }

  .ready-btn{
    display:inline-flex;align-items:center;gap:10px;
    background:var(--vermilion);
    color:var(--white);
    border:none;border-radius:6px;
    padding:16px 40px;
    font-size:16px;font-weight:500;
    font-family:inherit;
    letter-spacing:0.03em;
    cursor:pointer;
    position:relative;
    opacity:0;animation:btn-in 0.5s var(--ease) 1.3s forwards;
    transition:transform 0.2s var(--ease),box-shadow 0.3s ease;
  }
  .ready-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 0 0 0 rgba(192,57,43,0);
    animation:btn-pulse 2s ease-in-out 1.8s infinite;
  }
  @keyframes btn-in{
    from{opacity:0;transform:translateY(16px)}
    to{opacity:1;transform:translateY(0)}
  }
  @keyframes btn-pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,0.4)}
    50%{box-shadow:0 0 0 12px rgba(192,57,43,0)}
  }

  .ready-btn-arrow{
    display:inline-block;
    transition:transform 0.2s var(--ease);
  }
  .ready-btn:hover .ready-btn-arrow{transform:translateX(3px)}

  /* ── Demo Navigation Bar ── */
  .demo-nav{
    position:fixed;bottom:0;left:0;right:0;
    height:48px;
    background:rgba(15,15,15,0.9);
    backdrop-filter:blur(12px);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;
    z-index:9999;
    font:11px/1 system-ui,sans-serif;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--stone);
  }
  .demo-nav a{color:inherit;text-decoration:none;transition:color 0.2s ease}
  .demo-nav a:hover{color:var(--vermilion)}
  .demo-nav .nav-prev{min-width:80px}
  .demo-nav .nav-center{text-align:center;flex:1}
  .demo-nav .nav-next{min-width:80px;text-align:right}
  .demo-nav .nav-dots{display:flex;gap:6px;align-items:center;min-width:80px;justify-content:flex-end}
  .demo-nav .nav-dot{width:6px;height:6px;border-radius:50%;background:rgba(232,228,225,0.3);display:inline-block}
  .demo-nav .nav-dot.active{background:var(--vermilion)}
  .demo-nav .nav-spacer{min-width:80px}
  .demo-index-link{
    position:fixed;top:16px;right:24px;z-index:9999;
    font:11px/1 system-ui,sans-serif;
    letter-spacing:0.1em;text-transform:uppercase;
    color:var(--stone);text-decoration:none;
    transition:color 0.2s ease;
  }
  .demo-index-link:hover{color:var(--vermilion)}

  /* ── Responsive ── */
  @media(max-width:768px){
    .badges{flex-direction:column;gap:12px;align-items:center}
    .badge{width:200px;text-align:center}
    .progress-wrap{width:260px}
  }
</style>
</head>
<body>

<div class="dot-grid"></div>

<div class="scene-wrap">

  <!-- ═══════ SCENE 1: SELECT MODEL ═══════ -->
  <div class="scene active" id="scene1">
    <div class="step-dots">
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
    </div>

    <div class="step-label">Step 1 — Select Model</div>

    <div class="file-icon">
      <div class="doc-body">
        <div class="doc-fold"></div>
        <div class="doc-line"></div>
        <div class="doc-line"></div>
        <div class="doc-line"></div>
        <div class="doc-line"></div>
      </div>
    </div>

    <div class="badges">
      <div class="badge" data-fw="pytorch">
        PyTorch
        <span class="badge-check">
          <svg viewBox="0 0 16 16"><polyline points="3,8 7,12 13,4"/></svg>
        </span>
      </div>
      <div class="badge" data-fw="onnx">
        ONNX
        <span class="badge-check">
          <svg viewBox="0 0 16 16"><polyline points="3,8 7,12 13,4"/></svg>
        </span>
      </div>
      <div class="badge" data-fw="tensorflow">
        TensorFlow
        <span class="badge-check">
          <svg viewBox="0 0 16 16"><polyline points="3,8 7,12 13,4"/></svg>
        </span>
      </div>
    </div>
  </div>

  <!-- ═══════ SCENE 2: UPLOAD & DETECT ═══════ -->
  <div class="scene" id="scene2">
    <div class="step-dots">
      <div class="step-dot done"></div>
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
    </div>

    <div class="step-label">Step 2 — Upload &amp; Detect</div>

    <div class="upload-arrow">
      <svg viewBox="0 0 48 48">
        <line x1="24" y1="38" x2="24" y2="12"/>
        <polyline points="14,22 24,12 34,22"/>
        <line x1="8" y1="38" x2="40" y2="38"/>
      </svg>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
    </div>

    <div class="detection">
      <div class="detection-name">DINOv2-Base</div>
      <div class="detection-stats">86M params · 344MB</div>
    </div>
  </div>

  <!-- ═══════ SCENE 3: READY ═══════ -->
  <div class="scene" id="scene3">
    <div class="step-dots">
      <div class="step-dot done"></div>
      <div class="step-dot done"></div>
      <div class="step-dot active"></div>
    </div>

    <div class="step-label">Step 3 — Ready</div>

    <div class="check-circle-wrap">
      <svg class="check-circle-svg" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="56"/>
        <polyline class="draw" points="36,62 52,78 84,44"/>
      </svg>
    </div>

    <div class="ready-title">Model Ready</div>

    <button class="ready-btn">
      Continue to Optimization
      <span class="ready-btn-arrow">&#8594;</span>
    </button>
  </div>

</div>

<a href="index.html" class="demo-index-link">Index</a>

<nav class="demo-nav">
  <div class="nav-prev"><a href="04-benchmarks.html">← Prev</a></div>
  <div class="nav-center">05/07 · Upload Flow</div>
  <div class="nav-next"><a href="06-results.html">Next →</a></div>
  <div class="nav-dots">
    <span class="nav-dot"></span>
    <span class="nav-dot"></span>
    <span class="nav-dot"></span>
    <span class="nav-dot"></span>
    <span class="nav-dot active"></span>
    <span class="nav-dot"></span>
    <span class="nav-dot"></span>
  </div>
</nav>

<script>
(function(){
  const scenes = [
    document.getElementById('scene1'),
    document.getElementById('scene2'),
    document.getElementById('scene3')
  ];
  let current = 0;

  function advanceScene(){
    if(current >= scenes.length - 1) return;
    const from = scenes[current];
    const to = scenes[current + 1];
    from.classList.remove('active');
    from.classList.add('exit');
    to.classList.add('active');
    current++;
    setTimeout(()=>{ from.classList.remove('exit') }, 400);
  }

  // Auto-advance: scene 1 at 3.5s, scene 2 at 7s
  setTimeout(()=>advanceScene(), 3500);
  setTimeout(()=>advanceScene(), 7000);

  // Badge click: auto-select PyTorch after brief moment
  const pytorch = document.querySelector('[data-fw="pytorch"]');
  setTimeout(()=>{
    pytorch.classList.add('selected');
  }, 2200);

  // Click any badge to select it
  document.querySelectorAll('.badge').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.badge').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
    });
  });
})();
</script>

</body>
</html>
